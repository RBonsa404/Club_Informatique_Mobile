name: club_informatique_mobile
description: "Application mobile du Club Informatique de l'IST"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  provider: ^6.1.5+1
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.21
  url_launcher: ^6.3.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/logo-256.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-400.ttf
          weight: 400
        - asset: assets/fonts/inter-500.ttf
          weight: 500
        - asset: assets/fonts/inter-600.ttf
          weight: 600
        - asset: assets/fonts/inter-700.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins-600.ttf
          weight: 600
        - asset: assets/fonts/poppins-700.ttf
          weight: 700
        - asset: assets/fonts/poppins-800.ttf
          weight: 800
